[package]
name = "vhost-device-vsock"
version = "0.3.0"
authors = ["Harshavardhan Unnibhavi <harshanavkis@gmail.com>", "Stefano Garzarella <sgarzare@redhat.com>"]
description = "A virtio-vsock device using the vhost-user protocol."
repository = "https://github.com/rust-vmm/vhost-device"
readme = "README.md"
keywords = ["vhost", "vsock"]
license = "Apache-2.0 OR BSD-3-Clause"
edition = "2021"

[features]
default = ["backend_vsock", "completion"]
backend_vsock = ["vsock", "libc"]
xen = ["vm-memory/xen", "vhost/xen", "vhost-user-backend/xen"]
# Run the vring workers on vhost-user-backend's completion-port loop instead of its epoll loop
# (ADR-0001, action item 5). Windows only; inert elsewhere. A plain `cargo build` on Windows is
# therefore the completion loop; `--no-default-features --features backend_vsock` is the epoll
# loop (and its Windows emulation), kept for the transition until ADR-0001 action item 6 deletes
# the epoll/AFD shim from vmm-sys-util.
completion = ["vhost-user-backend/completion", "vmm-sys-util/completion"]

[dependencies]
byteorder = "1"
clap = { version = "4.6",  features = ["derive"] }
env_logger = "0.11"
log = "0.4"
thiserror = "2.0"
vhost = { workspace = true }
vhost-user-backend = { workspace = true }
virtio-bindings = { workspace = true }
virtio-queue = { workspace = true }
virtio-vsock = "0.12"
vm-memory = { workspace = true }
vmm-sys-util = { workspace = true }
figment = { version = "0.10.19", features = ["yaml"] }
serde = { version = "1", features = ["derive"] }

# The host-side vsock backend needs AF_VSOCK, which is Linux only. But
# `backend_vsock` is a default feature, so on Windows the feature is on while
# these crates are absent. The code gates on `all(feature = "backend_vsock",
# unix)` everywhere to cope, which keeps a plain `cargo build` working on
# Windows. On Unix that condition means the same as the feature alone.
[target.'cfg(unix)'.dependencies]
vsock = { version = "0.5.4", optional = true }
libc = { version = "0.2.186", optional = true }

# std has no UnixStream on Windows even though the OS has had AF_UNIX
# since 1803.
[target.'cfg(windows)'.dependencies]
uds_windows = "1.1"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
assert_matches = "1.5"
virtio-queue = { workspace = true, features = ["test-utils"] }
tempfile = "3.27.0"

[lints]
workspace = true
